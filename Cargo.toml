[package]
name = "legiontoolkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A native GTK4/libadwaita control panel for Lenovo Legion laptops"
license = "GPL-3.0-or-later"
repository = "https://github.com/adeerkhan/LenovoLegionLinuxToolkit"
default-run = "legiontoolkit"

[lib]
name = "legiontoolkit"
path = "src/lib.rs"

[[bin]]
name = "legiontoolkit"
path = "src/main.rs"
required-features = ["gui"]

# The privileged helper. Deliberately built without the GUI feature so it cannot
# pull a GTK runtime into a process that runs as root.
[[bin]]
name = "legiontoolkit-helper"
path = "src/bin/legiontoolkit-helper.rs"

[features]
default = ["gui"]
# The GTK runtime. Off by default only via --no-default-features, which lets the
# capability layer, path resolution and the security policy be tested and used
# without a display.
gui = ["dep:adw", "dep:glib", "dep:gtk4", "gtk4/v4_22", "adw/gtk_v4_22", "adw/v1_9"]

[dependencies]
anyhow = "1"
# The libadwaita crate is published as `libadwaita`; rename it to `adw` so the
# source reads the way the upstream examples do.
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"], optional = true }
glib = { version = "0.22", optional = true }
# v4_22 matches the system GTK (4.22.5) and, through libadwaita's gtk_v4_22,
# is what gates NavigationSplitView / NavigationPage / ToolbarView and
# CssProvider::load_from_string.
gtk4 = { version = "0.11", features = ["v4_22"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
# The GitHub releases API, for update notification.
ureq = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
