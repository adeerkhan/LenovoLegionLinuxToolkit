name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The library half is tested with no GTK installed, on purpose: it proves the
  # capability, path-resolution and security-policy layers stay usable — and
  # testable — on a machine with no display.
  test:
    name: Library tests (headless, no GTK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No third-party Rust action: rustup is the canonical install and does
      # not depend on an action repo staying available.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Test the library without GTK
        run: cargo test --lib --no-default-features --verbose

      - name: Build the privileged helper
        run: cargo build --bin legiontoolkit-helper --no-default-features --verbose

      - name: Lint
        run: |
          rustup component add clippy
          cargo clippy --lib --no-default-features -- -D warnings

  # The GUI needs GTK 4.22 / libadwaita 1.9, which no current Ubuntu LTS ships.
  # The project targets Fedora, so the GUI job runs in a Fedora container where
  # the exact versions the crates are pinned to are present.
  gui:
    name: GUI build, format and lint (Fedora)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK 4, libadwaita and build tools
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make git \
            gtk4-devel libadwaita-devel pango-devel \
            gdk-pixbuf2-devel cairo-gobject-devel graphene-devel

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add clippy rustfmt

      # Built one target at a time, matching the Makefile. `--bins` shares one
      # feature resolution across targets, which links GTK into the privileged
      # helper — a process that runs as root and must not pull in a GUI runtime.
      - name: Build the GUI
        run: cargo build --release --bin legiontoolkit

      - name: Build the helper and the probe without GTK
        run: |
          cargo build --release --bin legiontoolkit-helper --no-default-features
          cargo build --release --bin legiontoolkit-keyboard-probe --no-default-features

      - name: Format check
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
